<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ניהול הזמנות | סטודיו שולחן</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="config.js" defer></script><script src="admin.js" defer></script></head><body>
<header><a class="brand" href="index.html"><img src="logo.svg" alt="" width="48" height="48"><span>סטודיו <strong>שולחן.</strong><small>ניהול החנות</small></span></a><nav><a href="index.html">בחזרה לחנות</a><button id="logout" class="secondary" hidden>התנתקות</button></nav></header>
<main class="admin-main"><section id="login-panel" class="login-panel"><p class="eyebrow">מאחורי הקלעים</p><h1>כניסת מנהלת</h1><p>ניהול ההזמנות של סטודיו שולחן.</p><form id="login-form"><label>אימייל<input type="email" name="email" autocomplete="username" dir="ltr" required maxlength="254"></label><label>סיסמה<input type="password" name="password" autocomplete="current-password" required></label><p id="login-error" class="error" role="alert"></p><button id="login-submit" class="wide">כניסה לניהול</button></form><p class="note">הכניסה מיועדת לחשבון מנהלת מורשה בלבד.</p></section>
<section id="dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">ניהול החנות</p><h1>ההזמנות שלכם</h1><p id="account-email" class="note"></p></div><button id="refresh" class="secondary">רענון הזמנות ↻</button></div><div class="admin-controls"><label>סטטוס הזמנה<select id="status-filter"><option value="">כל הסטטוסים</option><option value="new">חדשה</option><option value="in_progress">בטיפול</option><option value="completed">הושלמה</option></select></label><p id="order-count" class="note"></p></div><p id="admin-message" role="status" aria-live="polite"></p><div id="orders"></div><button id="load-more" class="secondary wide" hidden>טעינת הזמנות נוספות</button></section></main><footer><span>סטודיו שולחן · ניהול הזמנות</span><a href="index.html">מעבר לחנות ←</a></footer></body></html>
